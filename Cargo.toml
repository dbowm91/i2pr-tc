[workspace]
resolver = "2"
members = ["crates/i2pr-tc-core", "crates/i2pr-tc-storage", "crates/i2pr-tc-i2p", "crates/i2pr-tc-transmission"]
exclude = ["fuzz"]

[workspace.package]
# Deliberate toolchain policy: i2pr-tc is built by the same line as the router,
# so it shares the router's floor rather than carrying an independent, lower one.
# A lower floor would buy nothing here: there is no downstream consumer that
# cannot also build the router, and an undeclared floor only hides drift.
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
sha1 = "0.10"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "sync", "time", "macros", "rt"] }
async-trait = "0.1"
sha2 = "0.10"
base64 = "0.22"
fs2 = "0.4"
