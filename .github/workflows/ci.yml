name: Rust checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Uses the pinned `rust-toolchain.toml`, so CI proves the declared floor
      # rather than whatever `stable` happens to be.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Workspace check
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - name: Dependency policy
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Foundation boundary guard
        run: python3 scripts/check-foundation-boundaries.py --self-test
      - name: Declared toolchain floor
        run: |
          rustc --version
          cargo metadata --format-version 1 --no-deps \
            | grep -q '"rust_version":"1.89"' \
            || { echo "workspace floor is not the declared 1.89"; exit 1; }
