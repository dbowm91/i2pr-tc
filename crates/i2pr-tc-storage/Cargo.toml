[package]
name = "i2pr-tc-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
i2pr-tc-core = { path = "../i2pr-tc-core", version = "0.1.0" }
sha1.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Dev-only: the production surface of this crate stays free of an async runtime
# so the same synchronous API serves the Transmission adapter.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
